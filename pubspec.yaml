name: teleprompter_ai
version: 0.8.0+8
description: Teleprompter com ASR streaming em pt-BR, gravacao e controle remoto LAN.
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.2
  speech_to_text: ^7.5.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.3
  share_plus: ^13.3.1
  record: ^7.1.2
  sherpa_onnx: ^1.13.8
  native_video_editor: ^0.4.0
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/whisper/
    - assets/models/streaming/
